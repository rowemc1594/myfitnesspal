<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./app.css">
  <title>Lifting &amp; Diet Tracker</title>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1 id="screen-title">Today</h1>
      <!-- TEMPORARY (testing): wipes all data. Remove before real use. -->
      <button id="demo-btn" class="btn btn-secondary btn-sm" aria-label="Load sample data (testing)">Demo</button>
      <button id="reset-btn" class="btn btn-secondary btn-sm" aria-label="Clear all data (testing)">Reset</button>
      <button id="weight-btn" class="btn btn-secondary btn-sm">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9a5 5 0 0 1 8 0"/><path d="M12 9l1.5-2"/></svg>
        Weight
      </button>
    </header>
    <main id="screen-container"></main>
    <nav id="bottom-nav">
      <button class="nav-btn active" data-screen="today">
        <svg class="icon nav-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Today</span>
      </button>
      <button class="nav-btn" data-screen="workouts">
        <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>
        <span>Workouts</span>
      </button>
      <button class="nav-btn" data-screen="meals">
        <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2.2 1-3 3.5-3 7v3h3"/></svg>
        <span>Meals</span>
      </button>
      <button class="nav-btn" data-screen="history">
        <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M4 20h16M7 20v-6M12 20V6M17 20v-10"/></svg>
        <span>History</span>
      </button>
    </nav>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <button id="modal-close" aria-label="Close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="rest-timer-bar"></div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <script src="./plan.js"></script>
  <script src="./app.js"></script>
  <script src="./screens/meals.js"></script>
  <script src="./screens/today.js"></script>
  <script src="./screens/workouts.js"></script>
  <script src="./screens/history.js"></script>
  <script src="./screens/bodyweight.js"></script>
  <script>App.init();</script>
</body>
</html>
