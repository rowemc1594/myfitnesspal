<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./app.css">
  <title>Lifting &amp; Diet Tracker</title>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1 id="screen-title">Today</h1>
    </header>
    <main id="screen-container"></main>
    <nav id="bottom-nav">
      <button class="nav-btn active" data-screen="today">
        <span class="nav-icon">📅</span>
        <span>Today</span>
      </button>
      <button class="nav-btn" data-screen="workouts">
        <span class="nav-icon">🏋️</span>
        <span>Workouts</span>
      </button>
      <button class="nav-btn" data-screen="meals">
        <span class="nav-icon">🥗</span>
        <span>Meals</span>
      </button>
      <button class="nav-btn" data-screen="history">
        <span class="nav-icon">📊</span>
        <span>History</span>
      </button>
    </nav>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <button id="modal-close" aria-label="Close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="rest-timer-bar"></div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <script src="./plan.js"></script>
  <script src="./app.js"></script>
  <script src="./screens/today.js"></script>
  <script src="./screens/workouts.js"></script>
  <script src="./screens/meals.js"></script>
  <script src="./screens/history.js"></script>
  <script src="./screens/bodyweight.js"></script>
  <script>App.init();</script>
</body>
</html>
